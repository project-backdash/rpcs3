name: PBD checks

# The checks of CHECKS.md. Upstream's own workflows run beside this one, unchanged.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pbd-checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  format:
    name: C++ formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the checks compare against the upstream base commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format 20.1.8
        run: python -m pip install clang-format==20.1.8

      - name: Files the fork adds
        run: python tools/pbd_check_format.py

      - name: Lines this pull request changes
        if: github.event_name == 'pull_request'
        run: python tools/pbd_check_format.py --changed ${{ github.event.pull_request.base.sha }}

  core:
    name: Core stands without the emulator
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The check's own tests
        run: python -m unittest discover -s tools -p "test_pbd_check_core.py"

      - name: Includes and names in rpcs3/Emu/PBD/core
        run: python tools/pbd_check_core.py
